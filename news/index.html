<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Лента новостей SonaQ — посты со стены официального сообщества ВКонтакте.">
    <meta property="og:title" content="Лента новостей — SonaQ">
    <meta property="og:description" content="Свежие посты со стены VK: релизы, клипы, закулисье.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sonaq.studio/news/">
    <meta property="og:image" content="https://sonaq.studio/og-image.jpg">
    <title>Лента новостей — SonaQ</title>
    <link rel="stylesheet" href="../css/style.css?v=20260824a">
    <link rel="icon" href="../favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="../favicon.png" sizes="180x180">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="page-content">
        <div class="container">
            <h1 class="section-title" style="font-size:2rem; margin-top:0;">Лента новостей</h1>
            <p class="muted" style="margin-bottom:1.25rem;">
                Живая стена сообщества
                <a href="https://vk.com/sonaq.official" target="_blank" rel="noopener">vk.com/sonaq.official</a>
                — посты появляются здесь автоматически.
            </p>

            <div class="vk-feed-wrap">
                <!-- Официальный виджет сообщества ВК, mode=4 = стена -->
                <div id="vk_groups"></div>
            </div>

            <p class="muted" style="margin-top:1.25rem;">
                Если лента не загрузилась (блокировщик / сеть) —
                <a href="https://vk.com/sonaq.official" target="_blank" rel="noopener">открой сообщество ВК</a>.
            </p>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../js/site.js?v=20260824a"></script>
    <script src="https://vk.com/js/api/openapi.js?169" defer></script>
    <script>
      (function () {
        var GROUP_ID = 229780192; // sonaq.official
        function mountVk() {
          if (!window.VK || !VK.Widgets || !VK.Widgets.Group) return false;
          VK.Widgets.Group(
            "vk_groups",
            {
              mode: 4, // стена / посты
              wide: 1,
              width: "auto",
              height: 800,
              color1: "0A0A0A",
              color2: "E8E8E8",
              color3: "00F7FF",
            },
            GROUP_ID
          );
          return true;
        }
        function tryMount(attemptsLeft) {
          if (mountVk()) return;
          if (attemptsLeft <= 0) {
            var slot = document.getElementById("vk_groups");
            if (slot && !slot.childNodes.length) {
              slot.innerHTML =
                '<p class="muted">Не удалось загрузить виджет ВК. ' +
                '<a href="https://vk.com/sonaq.official" target="_blank" rel="noopener">Перейти в сообщество</a>.</p>';
            }
            return;
          }
          setTimeout(function () {
            tryMount(attemptsLeft - 1);
          }, 200);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () {
            tryMount(25);
          });
        } else {
          tryMount(25);
        }
      })();
    </script>
</body>
</html>
